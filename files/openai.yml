openapi: 3.0.0
info:
  title: "ServiceNow REST APIs"
  description: "REST APIs to retrieve and create ServiceNow incidents"
  version: "1.0"
servers:
  - url: "https://servicenowdaapi-cce9f8efcybxd0ee.canadacentral-01.azurewebsites.net/"
paths:
  /api/Incident:
    get:
      operationId: getIncidents
      summary: Retrieve ServiceNow incidents
      description: Fetches a list of ServiceNow incidents
      parameters: []
      responses:
        '200':
          description: A list of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
    post:
      operationId: createIncident
      summary: Create a new incident
      description: Creates a new incident in ServiceNow on behalf of the logged in user.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentRequest'
      responses:
        '200':
          description: Incident created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "Incident created successfully"
                    description: A description of the result
                  number:
                    type: string
                    description: Incident number
                    example: "INC0010001"
                  short_description:
                    type: string
                    description: Short description of the created incident
                    example: "Can't read email"
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing required fields: shortDescription or description"
        '500':
          description: Error creating incident
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error creating incident: Record insert failed"

components:
  schemas:
    Incident:
      type: object
      properties:
        number:
          type: string
          description: The number ID of the incident
        short_description:
          type: string
          description: A brief description of the incident
        state:
          type: string
          description: The current status of the incident
      additionalProperties: false

    IncidentRequest:
      type: object
      properties:
        shortDescription:
          type: string
          description: Brief description of the incident
          example: "Can't read email"
        description:
          type: string
          description: Full description of the incident
          example: "User can't access email on mail.company.com."
        category:
          type: string
          description: Category of the incident
          example: "network"
        impact:
          type: integer
          description: Impact level of the incident (1 = High, 2 = Medium, 3 = Low)
          example: 3
        urgency:
          type: integer
          description: Urgency level of the incident (1 = High, 2 = Medium, 3 = Low)
          example: 3
      required:
        - shortDescription
        - description
      additionalProperties: false